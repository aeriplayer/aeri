[workspace]
members = [
    "crates/aeri-alloc-guard",
    "crates/aeri-core",
    "crates/aeri-audio",
    "crates/aeri-decode",
    "crates/aeri-dsp",
    "crates/aeri-engine",
    "crates/aeri-player",
    "crates/aeri-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/aeriplayer/aeri"
authors      = ["Elliot Farmer Garcia"]
rust-version = "1.100.0"
publish      = false

[workspace.dependencies]
aeri-alloc-guard = { path = "crates/aeri-alloc-guard" }
aeri-audio       = { path = "crates/aeri-audio" }
aeri-core        = { path = "crates/aeri-core" }
aeri-decode      = { path = "crates/aeri-decode" }
aeri-dsp         = { path = "crates/aeri-dsp" }
aeri-engine      = { path = "crates/aeri-engine" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
cargo_metadata = { version = "0.23.1", default-features = false }
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "usage",
] }
coreaudio-rs = { version = "0.14.2", default-features = false, features = [
    "audio_unit",
    "core_audio",
] }
divan = { package = "codspeed-divan-compat", version = "6.0.0", default-features = false }
fastrand = { version = "2.5.0", default-features = false }
fs-err = { version = "3.3.2", default-features = false }
loom = { version = "0.7.3", default-features = false }
pipewire = { version = "0.10.1", default-features = false, features = ["v0_3_49"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rtrb = { version = "0.4.1", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "id3v2", "mp3"] }
thiserror = { version = "2.0.21", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# Rationale for each group: docs/TOOLING.md.

[workspace.lints.cargo]
unused_workspace_dependencies   = "deny"
unused_workspace_package_fields = "deny"

[workspace.lints.rust]
unsafe_code                   = "deny"
unsafe_op_in_unsafe_fn        = "deny"
missing_docs                  = "warn"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unnameable_types              = "warn"
unused_qualifications         = "warn"
unfulfilled_lint_expectations = "warn"
unexpected_cfgs               = { level = "warn", check-cfg = ["cfg(fuzzing)", "cfg(loom)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links  = "deny"
private_intra_doc_links = "deny"
bare_urls               = "warn"

[workspace.lints.clippy]
# Priority -1 lets the individual levels below win.
pedantic             = { level = "warn", priority = -1 }
nursery              = { level = "warn", priority = -1 }
missing_const_for_fn = "allow"
redundant_pub_crate  = "allow"

unwrap_used   = "deny"
get_unwrap    = "deny"
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
print_stdout  = "deny"
print_stderr  = "deny"

undocumented_unsafe_blocks    = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment    = "warn"
unnecessary_safety_doc        = "warn"

allow_attributes                = "deny"
allow_attributes_without_reason = "deny"

mod_module_files                = "deny"
clone_on_ref_ptr                = "warn"
unused_trait_names              = "warn"
mem_forget                      = "deny"
lossy_float_literal             = "warn"
error_impl_error                = "warn"
tests_outside_test_module       = "warn"
exit                            = "warn"
empty_drop                      = "warn"
empty_structs_with_brackets     = "warn"
rc_buffer                       = "warn"
rc_mutex                        = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type             = "warn"

# Rationale for each profile: docs/TOOLING.md.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true

[profile.profiling]
inherits = "release"
debug    = "full"
strip    = false
lto      = false

[profile.dist]
inherits = "release"
