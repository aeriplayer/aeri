[workspace]
members = [
    "crates/aeri-core",
    "crates/aeri-audio",
    "crates/aeri-decode",
    "crates/aeri-engine",
    "crates/aeri-ipc",
    "crates/aeri-cli",
    "xtask",
]
# Crates are created in the phase that first needs them; see docs/ARCHITECTURE.md for
# the planned graph. Not yet created: aeri-library, aeri-dsp, aeri-platform, aeri-gui,
# aeri-stream.
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/aeriplayer/aeri"
authors      = ["Elliot Farmer Garcia"]
rust-version = "1.95"
# aeri ships as binaries, not as crates.io packages. This also lets cargo-deny tell
# the workspace's own path dependencies apart from wildcard version requirements.
publish = false

[workspace.dependencies]
# Internal
aeri-core   = { path = "crates/aeri-core" }
aeri-audio  = { path = "crates/aeri-audio" }
aeri-decode = { path = "crates/aeri-decode" }
aeri-engine = { path = "crates/aeri-engine" }
# default-features off so a `Player`-only consumer (aeri-platform, Phase 5) does not
# pull in the engine; hosts that own an engine enable `local` explicitly (ADR 0003).
aeri-ipc = { path = "crates/aeri-ipc", default-features = false }

# External dependencies are added when the first line of code needs them, at the
# then-current version — cargo-machete fails the build on any that go unused. The
# crates already chosen for later phases are recorded in docs/ARCHITECTURE.md.

# IPC code generation (build-dependencies of aeri-ipc).
# Keep these two on the same minor: connectrpc 0.8 requires `buffa ^0.8.1`, and
# mixing in buffa 0.9 would generate types its service traits cannot accept.
connectrpc-build = "0.8" # Tower service stubs from .proto
buffa-build      = "0.8" # .proto → Rust types

# Error handling (binaries and xtask)
anyhow = "1.0.104"

# Workspace-wide lint configuration.
# pedantic/nursery are at priority -1 so individual #[allow] overrides still work.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# Nursery lint: fires on functions that are incidentally const-able today but
# would become breaking changes to un-const later. Not worth the churn.
missing_const_for_fn = "allow"
