[package]
name    = "aeri-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aeri-decode   = { path = "../crates/aeri-decode" }
aeri-player   = { path = "../crates/aeri-player" }
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }

# ADR 0015: not a member of the root workspace.
[workspace]

[[bin]]
name  = "decode"
path  = "fuzz_targets/decode.rs"
test  = false
doc   = false
bench = false

[profile.release]
debug = 1

[[bin]]
name  = "m3u"
path  = "fuzz_targets/m3u.rs"
test  = false
doc   = false
bench = false
