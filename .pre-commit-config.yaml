# Rationale for stages, priorities and each hook: docs/TOOLING.md.

minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

exclude: '^LICENSE-'

priorities:
  fix-whitespace: 0
  fix-eof: 1
  fix-eol: 2
  fix-bom: 3
  fix-toml: 5
  fix-markdown: 6
  fix-rust: 7
  check: 10
  clippy: 20
  dependency-policy: 21
  test: 30
  doctest: 31
  doc: 32
  features: 33
  deny: 34
  manual: 40

update:
  freeze: true
  cooldown_days: 7
  repos:
    "https://github.com/crate-ci/typos":
      include_tags: "v*" # the repository also tags its dictionaries

repos:
  - repo: https://github.com/crate-ci/committed
    rev: 02af07ed1d11ad69a96ab75f08c9831a4e2c00da # frozen: v1.1.12
    hooks:
      - id: committed

  - repo: builtin
    hooks:
      - id: check-commit-trailers
        stages: [commit-msg]
        args:
          - '--deny=Co-authored-by=(?i)(claude|anthropic|copilot|\bbot\b|noreply@)'
          - --deny=Generated-by

  - repo: builtin
    hooks:
      - id: trailing-whitespace
        priority: fix-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        priority: fix-eof
      - id: mixed-line-ending
        priority: fix-eol
        args: [--fix=lf]
      - id: fix-byte-order-marker
        priority: fix-bom

      - id: no-commit-to-branch
        priority: check
        args: [--branch=main]
      - { id: check-merge-conflict, priority: check }
      - { id: check-case-conflict, priority: check }
      - { id: check-symlinks, priority: check }
      - { id: destroyed-symlinks, priority: check }
      - { id: check-executables-have-shebangs, priority: check }
      - { id: check-shebang-scripts-are-executable, priority: check }
      - id: check-added-large-files
        priority: check
        args: [--maxkb=256]
      - { id: detect-private-key, priority: check }
      - { id: forbid-new-submodules, priority: check }
      - { id: check-toml, priority: check }
      - { id: check-yaml, priority: check }
      - { id: check-vcs-permalinks, priority: check }

  # `check-hooks-apply` is omitted on purpose: some guards cover files not yet present.
  - repo: meta
    hooks:
      - { id: check-useless-excludes, priority: check }

  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888 # frozen: v1.52.2
    hooks:
      - { id: typos, priority: check, args: [--force-exclude] }

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: ade0f95ddcf661c697d4670d2cfcbe95d0048a0a # frozen: v0.9.3
    hooks:
      - { id: taplo-format, priority: fix-toml }

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: df5a947a3af0dba56640e644c6b9316184749168 # frozen: v0.3.4
    hooks:
      - { id: rumdl-fmt, priority: fix-markdown }
      - { id: rumdl-check, priority: check }

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - { id: actionlint, priority: check }

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # frozen: v1.32.0
    hooks:
      - { id: zizmor, priority: check }

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all
        types: [rust]
        pass_filenames: false
        priority: fix-rust

      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        files:
          glob: ["**/*.rs", "**/Cargo.toml", Cargo.lock, rust-toolchain.toml, ".cargo/**"]
        pass_filenames: false
        groups: [target]
        priority: clippy

      - id: cargo-shear
        name: cargo shear (unused and misplaced dependencies)
        language: system
        entry: cargo shear --deny-warnings
        files:
          glob: ["**/*.rs", "**/Cargo.toml", Cargo.lock]
        pass_filenames: false
        priority: check

      - id: check-deps
        name: dependency policy (cargo xtask check-deps)
        language: system
        entry: cargo xtask check-deps
        files:
          glob: ["**/Cargo.toml", Cargo.lock, deny.toml]
        pass_filenames: false
        priority: dependency-policy

      - id: cargo-nextest
        name: cargo nextest
        language: system
        entry: cargo nextest run --workspace --all-features --locked
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [target]
        priority: test

      - id: cargo-doctest
        name: cargo test --doc
        language: system
        entry: cargo test --doc --workspace --all-features --locked
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [target]
        priority: doctest

      - id: cargo-doc
        name: cargo doc
        language: system
        entry: cargo doc --workspace --no-deps --document-private-items --all-features --locked
        env: { RUSTDOCFLAGS: -D warnings }
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [target]
        priority: doc

      - id: cargo-hack
        name: cargo hack (feature powerset)
        language: system
        entry: cargo hack check --workspace --feature-powerset --locked
        always_run: true
        pass_filenames: false
        stages: [pre-push]
        groups: [target]
        priority: features

      - id: coverage
        name: coverage (cargo llvm-cov)
        language: system
        shell: sh
        entry: |
          cargo llvm-cov nextest --workspace --all-features --locked --no-report &&
          cargo llvm-cov report --ignore-filename-regex '(^|/)(xtask/|build\.rs$)' --fail-under-lines 85 &&
          cargo llvm-cov report --package aeri-core --fail-under-lines 100 &&
          cargo llvm-cov report --package aeri-dsp --fail-under-lines 100
        always_run: true
        pass_filenames: false
        stages: [manual]
        priority: manual

      - id: mutants
        name: mutation testing (cargo mutants)
        language: system
        shell: sh
        entry: |
          mkdir -p target
          git diff "${MUTANTS_BASE:-origin/main}"...HEAD > target/mutants.diff
          cargo mutants --in-diff target/mutants.diff --no-shuffle
        always_run: true
        pass_filenames: false
        stages: [manual]
        priority: manual

      - id: miri
        name: miri
        language: system
        entry: cargo +nightly miri test --workspace --all-features
        always_run: true
        pass_filenames: false
        stages: [manual]
        priority: manual

      - id: loom
        name: loom model of the real-time bridge
        language: system
        shell: sh
        entry: |
          RUSTFLAGS="--cfg loom" CARGO_TARGET_DIR=target/loom \
            cargo test --package aeri-audio --lib --release --locked loom_model
        always_run: true
        pass_filenames: false
        stages: [manual]
        priority: manual

      - id: fuzz
        name: fuzz the decoder (cargo fuzz)
        language: system
        shell: sh
        entry: |
          cd fuzz && mkdir -p corpus/decode &&
          cargo fuzz run --target "$(rustc -vV | sed -n 's/^host: //p')" \
            decode corpus/decode ../crates/aeri-decode/tests/fixtures -- \
            -max_total_time="${FUZZ_SECONDS:-60}" -timeout=10
        always_run: true
        pass_filenames: false
        stages: [manual]
        priority: manual

  - repo: https://github.com/EmbarkStudios/cargo-deny
    rev: bca0dde53651ee946720e4540b5ce2610bec8f06 # frozen: 0.20.2
    hooks:
      - id: cargo-deny
        args: [--all-features, check]
        always_run: true
        stages: [pre-push]
        priority: deny

  - repo: builtin
    hooks:
      - id: check-signed-commit
        stages: [pre-push]
