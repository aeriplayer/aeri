[graph]
targets      = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked  = "deny"

[licenses]
version              = 2
confidence-threshold = 0.93
allow                = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
# ADR 0014: MPL-2.0 for symphonia only.
exceptions = [
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-common", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    # ADR 0019: build-time only, for pipewire's bindings; none is linked into aeri.
    { crate = "bindgen", allow = ["BSD-3-Clause"] },
    { crate = "libloading", allow = ["ISC"] },
    { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true

# The crate graph from docs/ARCHITECTURE.md.
deny = [
    { crate = "aeri-engine", wrappers = ["aeri-player"] },
    { crate = "aeri-alloc-guard", wrappers = ["aeri-audio", "aeri-dsp"] },
    { crate = "aeri-audio", wrappers = ["aeri-engine"] },
    { crate = "aeri-decode", wrappers = ["aeri-engine"] },
    { crate = "aeri-dsp", wrappers = ["aeri-engine"] },
]

# Crates whose build scripts run arbitrary code at compile time; `cargo xtask check-deps`
# rejects entries that no longer match a crate.
[bans.build]
allow-build-scripts = [
    "anyhow",
    "bindgen",
    "camino",
    "clang-sys",
    "codspeed",
    "codspeed-divan-compat",
    "fs-err",
    "getrandom",
    "libc",
    "libspa",
    "libspa-sys",
    "nix",
    "num-traits",
    "objc2",
    "parking_lot_core",
    "pipewire-sys",
    "proc-macro2",
    "quote",
    "rustix",
    "serde",
    "serde_core",
    "serde_json",
    "signal-hook",
    "target-lexicon",
    "thiserror",
    "zmij",
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
