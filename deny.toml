[graph]
targets      = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked  = "deny"

[licenses]
version              = 2
confidence-threshold = 0.93
allow                = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions    = "warn"
wildcards            = "deny"
allow-wildcard-paths = true

# The crate graph from docs/ARCHITECTURE.md.
deny = [
    { crate = "aeri-engine", wrappers = ["aeri-ipc"] },
    { crate = "aeri-audio", wrappers = ["aeri-engine"] },
    { crate = "aeri-decode", wrappers = ["aeri-engine"] },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
