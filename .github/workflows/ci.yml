name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

concurrency:
  # A re-run of an older commit must not cancel the latest push to the same pull request.
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_attempt == 1 && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1
  NEXTEST_PROFILE: ci
  # Developer-machine guards; GitHub's merge commits carry no contributor signature.
  PREK_SKIP: no-commit-to-branch,check-signed-commit

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      release: ${{ steps.changes.outputs.release }}
      fuzz: ${{ steps.changes.outputs.fuzz }}
      audio: ${{ steps.changes.outputs.audio }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the pull request's merge commit and its base

      - name: Classify the changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            {
              echo "code=true"
              echo "release=true"
              echo "fuzz=true"
              echo "audio=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { ! git diff --quiet HEAD^1 HEAD -- "$@"; }
          if changed . ':(exclude)docs/' ':(exclude)*.md' ':(exclude).claude/' \
            ':(exclude)LICENSE-*' ':(exclude)COPYRIGHT' ':(exclude).rumdl.toml'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if changed dist-workspace.toml .github/workflows/release.yml rust-toolchain.toml \
            Cargo.toml Cargo.lock ':(glob)crates/*/Cargo.toml'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          if changed fuzz/ crates/aeri-decode/ crates/aeri-core/ crates/aeri-player/ Cargo.toml Cargo.lock; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi
          if changed crates/aeri-audio/ crates/aeri-core/ Cargo.toml Cargo.lock; then
            echo "audio=true" >> "$GITHUB_OUTPUT"
          else
            echo "audio=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-shear"
          cache-key: checks

      - name: Commit-stage hooks
        run: prek run --all-files --stage pre-commit --show-diff-on-failure --no-group target

      - name: Push-stage hooks
        run: prek run --all-files --stage pre-push --no-group target

  # `cfg(target_os)` code makes these results differ per platform.
  target:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-nextest cargo-hack"
          cache-key: ${{ matrix.target }}

      - name: cargo clippy
        run: prek run --all-files --stage pre-commit --group target

      - name: Tests, doctests, rustdoc, feature powerset
        run: prek run --all-files --stage pre-push --group target

  coverage:
    name: coverage
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-nextest cargo-llvm-cov"
          cache-key: coverage

      - name: cargo llvm-cov
        run: prek run coverage --all-files --stage manual

  benchmarks:
    name: benchmarks
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # CodSpeed authenticates a public repository with an OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-codspeed"
          cache-key: benchmarks

      - name: Build the benchmarks
        run: cargo codspeed build --profile profiling -p aeri-dsp

      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run -p aeri-dsp

  mutants:
    name: mutants
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MUTANTS_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff against the base branch needs history

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-nextest cargo-mutants"
          cache-key: mutants

      - name: cargo mutants (changed lines)
        run: prek run mutants --all-files --stage manual

  miri:
    name: miri
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: miri

      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri

      - name: cargo miri test
        run: prek run miri --all-files --stage manual

  # ADR 0018.
  loom:
    name: loom
    needs: plan
    if: needs.plan.outputs.audio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: loom

      - name: loom model of the real-time bridge
        run: prek run loom --all-files --stage manual

  # ADR 0015. The daily ten-minute run is in fuzz.yml.
  fuzz:
    name: fuzz
    needs: plan
    if: needs.plan.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-fuzz"
          cache-key: fuzz

      - name: Install the fuzzing nightly
        working-directory: fuzz
        run: rustup toolchain install # reads fuzz/rust-toolchain.toml

      - name: Fuzz the decoder and the playlist parser for 60 seconds each
        env:
          FUZZ_SECONDS: "60"
        run: prek run fuzz --all-files --stage manual

  cooldown:
    name: crate cooldown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # reuses crate publication times saved by the last green run on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/github-actions/cargo-cooldowns@4d0d0b9f3efeb82c92183f4423e395b81c3fcf5e

  release-plan:
    name: release plan
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "cargo-dist"
          cache-key: release-plan

      - name: dist plan
        run: dist plan --output-format=json
