name: CI

# Every check is defined once, in prek.toml. This workflow only decides where
# each group of hooks runs; it does not restate any command.

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  NEXTEST_PROFILE: ci
  # Hooks that only make sense on a developer machine: CI builds `main` itself,
  # and merge commits created by GitHub are not signed with a contributor key.
  PREK_SKIP: no-commit-to-branch,check-signed-commit

jobs:
  # Everything that gives the same answer on every platform: hygiene, formatting,
  # spelling, workflow security, unused dependencies, dependency policy.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: checks

      - name: Commit-stage hooks
        run: prek run --all-files --stage pre-commit --show-diff-on-failure --no-group target

      - name: Push-stage hooks
        run: prek run --all-files --stage pre-push --no-group target

  # Hooks in the `target` group — clippy, tests, docs, feature powerset — compile
  # `cfg(target_os)` code, so they run once per supported platform.
  target:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: ${{ matrix.target }}

      - name: cargo clippy
        run: prek run --all-files --stage pre-commit --group target

      - name: Tests, doctests, rustdoc, feature powerset
        run: prek run --all-files --stage pre-push --group target

  # Line coverage with a floor. See docs/TESTING.md: the floor is a tripwire,
  # not a goal.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: coverage

      - name: cargo llvm-cov
        run: prek run coverage --all-files --stage manual

  # Mutation testing of the lines this pull request changes: every mutant must be
  # caught by a test.
  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MUTANTS_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff against the base branch needs history

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: mutants

      - name: cargo mutants (changed lines)
        run: prek run mutants --all-files --stage manual

  # Miri interprets the tests and reports undefined behaviour in `unsafe` code.
  miri:
    name: miri
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: miri

      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri

      - name: cargo miri test
        run: prek run miri --all-files --stage manual
