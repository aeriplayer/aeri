name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  NEXTEST_PROFILE: ci
  # Developer-machine guards; GitHub's merge commits carry no contributor signature.
  PREK_SKIP: no-commit-to-branch,check-signed-commit

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: checks

      - name: Commit-stage hooks
        run: prek run --all-files --stage pre-commit --show-diff-on-failure --no-group target

      - name: Push-stage hooks
        run: prek run --all-files --stage pre-push --no-group target

  # `cfg(target_os)` code makes these results differ per platform.
  target:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: ${{ matrix.target }}

      - name: cargo clippy
        run: prek run --all-files --stage pre-commit --group target

      - name: Tests, doctests, rustdoc, feature powerset
        run: prek run --all-files --stage pre-push --group target

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: coverage

      - name: cargo llvm-cov
        run: prek run coverage --all-files --stage manual

  mutants:
    name: mutants
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MUTANTS_BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff against the base branch needs history

      - uses: $/.github/actions/setup
        with:
          tools: "true"
          cache-key: mutants

      - name: cargo mutants (changed lines)
        run: prek run mutants --all-files --stage manual

  miri:
    name: miri
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache-key: miri

      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri

      - name: cargo miri test
        run: prek run miri --all-files --stage manual
