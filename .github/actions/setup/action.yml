name: Set up aeri
description: >-
  Everything a job needs before it can run hooks: on Linux, the system headers
  that pipewire builds against; the pinned Rust toolchain, a cache of the
  registry and compiled dependencies, prek, and (optionally) the cargo tools the
  hooks call.

inputs:
  tools:
    description: >-
      Space-separated cargo subcommands from xtask to install (for example
      "cargo-nextest cargo-hack"); empty installs none
    required: false
    default: ""
  cache-key:
    description: Distinguishes caches of jobs that build differently
    required: true

runs:
  using: composite
  steps:
    # pipewire's bindings are generated at build time from the system headers (ADR 0019).
    - name: Install PipeWire headers and libclang
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev

    - name: Set up Rust toolchain
      shell: bash
      run: rustup toolchain install # reads rust-toolchain.toml

    # Pull requests read the cache; only main writes it, so a branch cannot poison it.
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      with:
        install-only: true

    # Lets `xtask install-tools` fetch prebuilt binaries instead of compiling.
    - if: inputs.tools != ''
      uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
      with:
        tool: cargo-binstall

    - name: Install cargo tools (versions pinned in xtask)
      if: inputs.tools != ''
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
        # Fail instead of silently compiling for minutes; xtask retries the lookup.
        BINSTALL_DISABLE_STRATEGIES: compile
        BINSTALL_MAXIMUM_RESOLUTION_TIMEOUT: "10"
        # Authenticated GitHub API requests are not throttled like anonymous ones.
        GITHUB_TOKEN: ${{ github.token }}
      run: cargo xtask install-tools $TOOLS
