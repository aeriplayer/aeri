[package]
name                   = "aeri-engine"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
rust-version.workspace = true
publish.workspace      = true
description            = "Playback engine: an actor that decodes a current track and a next slot into an output"

[lints]
workspace = true

[features]
test-util = ["aeri-audio/test-util", "aeri-decode/test-util"]

[dependencies]
aeri-audio.workspace  = true
aeri-core.workspace   = true
aeri-decode.workspace = true
aeri-dsp.workspace    = true
thiserror.workspace   = true
tokio.workspace       = true
tracing.workspace     = true

[dev-dependencies]
aeri-audio = { workspace = true, features = ["test-util"] }
tokio      = { workspace = true, features = ["macros", "rt", "time"] }

[[test]]
name              = "engine"
required-features = ["test-util"]
