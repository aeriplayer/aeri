[package]
name = "aeri-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Connect-RPC service, Player trait, LocalPlayer and RemotePlayer implementations"

[lints]
workspace = true

[build-dependencies]
buffa-build.workspace = true
connectrpc-build.workspace = true

[features]
default = ["local"]
# In-process `LocalPlayer`, which owns an engine. Remote-only clients disable this to
# avoid linking the audio backends, symphonia, and SQLite. See docs/adr/0003-ipc-local-feature.md.
local = ["dep:aeri-engine"]

[dependencies]
aeri-core.workspace = true
aeri-engine = { workspace = true, optional = true }
connectrpc.workspace = true
buffa.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
