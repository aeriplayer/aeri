[profile.default]
fail-fast    = false
slow-timeout = { period = "20s", terminate-after = 3 }
retries      = 0

[profile.ci]
success-output = "never"
failure-output = "immediate-final"

# For `cargo mutants`: a mutant is caught by the first failing test, and a test it leaves hung
# (a lost wake-up, a missing event) is a failing test, killed after ten seconds instead of sixty.
[profile.mutants]
fail-fast    = { max-fail = 1, terminate = "immediate" }
slow-timeout = { period = "5s", terminate-after = 2 }
